<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes recettes de saison</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Lilita+One&family=Lobster&family=Lora:wght@400;600&family=Mountains+of+Christmas:wght@400;700&family=Nunito:wght@400;700&family=Pacifico&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       1. THÈMES : chaque saison a ses couleurs, ses polices, son décor
       ============================================================ */

    /* 🌸 PRINTEMPS : pastels, fleurs, herbe tendre */
    body[data-saison="printemps"] {
      --f-h1: 'Pacifico', cursive;
      --f-h2: 'Pacifico', cursive;
      --f-script: 'Pacifico', cursive;
      --f-body: 'Nunito', Arial, sans-serif;
      --h1-weight: 400; --h1-style: normal; --h2-weight: 400;
      --h2-size: 1.35rem; --h3-size: 1.1rem; --sous-size: 1.35rem;
      --badge-size: 1rem; --pied-size: 1.3rem; --tab-size: 1rem;

      --bg: #fffaf6; --papier: #ffffff; --texte: #4a3a45;
      --c1: #d6336c; --c2: #2f8f4e; --c3: #7c4dbd; --accent: #f4a6c4;

      --header-bg:
        radial-gradient(ellipse 110px 34px at 14% 34%, rgba(255,255,255,.95), transparent 70%),
        radial-gradient(ellipse 140px 40px at 84% 26%, rgba(255,255,255,.95), transparent 70%),
        linear-gradient(180deg, #bfe9f7 0%, #fde6ee 100%);
      --titre-couleur: #d6336c; --sous-couleur: #2f6f45;
      --h1-ombre: 3px 3px 0 #ffffff;

      --nav-bg: #9bd8a8; --nav-txt: #1f4d2e;
      --tab-bg: rgba(255,255,255,.5); --tab-on-bg: #ffffff; --tab-on-txt: #d6336c;
      --info-bg: #ffe3ee;

      --motif:
        radial-gradient(rgba(240,120,170,.18) 5px, transparent 5px),
        radial-gradient(rgba(110,190,130,.22) 4px, transparent 4px);
      --motif-taille: 56px 56px; --motif-pos: 0 0, 28px 28px;
    }

    /* ☀️ ÉTÉ : plage, auvent rayé, soleil, mer turquoise */
    body[data-saison="ete"] {
      --f-h1: 'Lilita One', cursive;
      --f-h2: 'Lilita One', cursive;
      --f-script: 'Lilita One', cursive;
      --f-body: 'Nunito', Arial, sans-serif;
      --h1-weight: 400; --h1-style: normal; --h2-weight: 400;
      --h2-size: 1.5rem; --h3-size: 1.25rem; --sous-size: 1.5rem;
      --badge-size: 1rem; --pied-size: 1.4rem; --tab-size: 1.1rem;

      --bg: #fff6dc; --papier: #fffdf7; --texte: #3d2f1c;
      --c1: #e63946; --c2: #0782a3; --c3: #c25e00; --accent: #ffd166;

      --header-bg:
        radial-gradient(circle at 86% 46%, #fff3b0 0 44px, rgba(255,243,176,.55) 45px 78px, transparent 79px),
        linear-gradient(180deg, #ffe08a 0%, #ffc857 100%);
      --titre-couleur: #fffdf2; --sous-couleur: #0b5d73;
      --h1-ombre: 4px 4px 0 #e63946, 8px 8px 0 #0782a3;

      --nav-bg: #0782a3; --nav-txt: #ffffff;
      --tab-bg: rgba(255,255,255,.18); --tab-on-bg: #ffd166; --tab-on-txt: #7a3b00;
      --info-bg: #ffefb8;

      --motif:
        radial-gradient(rgba(7,130,163,.10) 6px, transparent 6px),
        radial-gradient(rgba(255,180,0,.22) 4px, transparent 4px);
      --motif-taille: 48px 48px; --motif-pos: 0 0, 24px 24px;
    }

    /* 🍂 AUTOMNE : feuilles mortes, papier crémeux, livre de cuisine */
    body[data-saison="automne"] {
      --f-h1: 'Playfair Display', Georgia, serif;
      --f-h2: 'Playfair Display', Georgia, serif;
      --f-script: 'Caveat', cursive;
      --f-body: 'Lora', Georgia, serif;
      --h1-weight: 500; --h1-style: italic; --h2-weight: 600;
      --h2-size: 1.4rem; --h3-size: 1.6rem; --sous-size: 1.9rem;
      --badge-size: 1.3rem; --pied-size: 1.8rem; --tab-size: 1.4rem;

      --bg: #fbf1e1; --papier: #fffaf1; --texte: #4a3123;
      --c1: #b5532a; --c2: #66713a; --c3: #7a2e2e; --accent: #d9a441;

      --header-bg: #b5532a;
      --titre-couleur: #fbf1e1; --sous-couleur: #f2c46d;
      --h1-ombre: 3px 3px 0 #7a2e2e;

      --nav-bg: #4a3123; --nav-txt: #fbf1e1;
      --tab-bg: rgba(255,255,255,.12); --tab-on-bg: #d9a441; --tab-on-txt: #4a3123;
      --info-bg: #f3e3c3;

      --motif: radial-gradient(rgba(181,83,42,.12) 1.5px, transparent 1.5px);
      --motif-taille: 22px 22px; --motif-pos: 0 0;
    }

    /* ❄️ HIVER : Noël rétro, guirlande, sucre d'orge */
    body[data-saison="hiver"] {
      --f-h1: 'Mountains of Christmas', cursive;
      --f-h2: 'Lobster', cursive;
      --f-script: 'Lobster', cursive;
      --f-body: 'Nunito', Arial, sans-serif;
      --h1-weight: 700; --h1-style: normal; --h2-weight: 400;
      --h2-size: 1.55rem; --h3-size: 1.4rem; --sous-size: 1.8rem;
      --badge-size: 1.1rem; --pied-size: 1.5rem; --tab-size: 1.15rem;

      --bg: #fff8e7; --papier: #fffdf6; --texte: #3d2b1f;
      --c1: #c8102e; --c2: #0b6e4f; --c3: #1f7f7c; --accent: #e0a526;

      --header-bg: #c8102e;
      --titre-couleur: #fff8e7; --sous-couleur: #ffe08a;
      --h1-ombre: 4px 4px 0 #7a0a1d;

      --nav-bg: #0b6e4f; --nav-txt: #fff8e7;
      --tab-bg: rgba(255,255,255,.15); --tab-on-bg: #fffdf6; --tab-on-txt: #c8102e;
      --info-bg: #fff0c2;

      --motif:
        radial-gradient(rgba(200,16,46,.13) 4px, transparent 4px),
        radial-gradient(rgba(11,110,79,.13) 4px, transparent 4px);
      --motif-taille: 44px 44px; --motif-pos: 0 0, 22px 22px;
    }

    /* ============================================================
       2. BASE COMMUNE
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--f-body);
      line-height: 1.7;
      color: var(--texte);
      background-color: var(--bg);
      background-image: var(--motif);
      background-size: var(--motif-taille);
      background-position: var(--motif-pos);
      min-height: 100vh;
    }

    /* ---------- En-tête ---------- */
    header {
      position: relative;
      text-align: center;
      padding: 46px 20px;
      background: var(--header-bg);
      color: var(--titre-couleur);
    }

    header::before,
    header::after { content: none; display: block; }

    .deco {
      font-size: 2rem;
      letter-spacing: 12px;
      margin-bottom: 6px;
    }

    h1 {
      font-family: var(--f-h1);
      font-weight: var(--h1-weight);
      font-style: var(--h1-style);
      font-size: clamp(2.5rem, 8vw, 4rem);
      line-height: 1.1;
      color: var(--titre-couleur);
      text-shadow: var(--h1-ombre);
    }

    .sous-titre {
      font-family: var(--f-script);
      font-size: var(--sous-size);
      color: var(--sous-couleur);
      margin-top: 8px;
    }

    /* ---------- Onglets ---------- */
    .onglets {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 14px 12px;
      background: var(--nav-bg);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.18);
    }

    .onglet {
      font-family: var(--f-script);
      font-size: var(--tab-size);
      color: var(--nav-txt);
      background: var(--tab-bg);
      border: 3px solid transparent;
      border-radius: 999px;
      padding: 6px 20px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .onglet:hover { transform: translateY(-2px); }

    .onglet.actif {
      background: var(--tab-on-bg);
      color: var(--tab-on-txt);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.22);
    }

    .onglet:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    /* ---------- Grille de recettes : 3 colonnes ---------- */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 20px 20px;
    }

    .recettes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 38px 30px;
      align-items: start;
      counter-reset: recette;
    }

    /* ---------- Cartes (base) ---------- */
    .recette {
      --c: var(--c1);
      position: relative;
      counter-increment: recette;
      background: var(--papier);
      text-align: center;
      animation: apparition 0.6s ease backwards;
      animation-delay: calc(var(--i) * 70ms);
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .recette:nth-child(3n+2) { --c: var(--c2); }
    .recette:nth-child(3n)   { --c: var(--c3); }

    .recette:hover { transform: translateY(-6px); }

    .emoji {
      font-size: 3rem;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .recette h2 {
      font-family: var(--f-h2);
      font-weight: var(--h2-weight);
      font-size: var(--h2-size);
      color: var(--c);
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .infos {
      display: inline-block;
      background: var(--info-bg);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 2px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    summary {
      display: table;
      margin: 0 auto;
      list-style: none;
      cursor: pointer;
      background: var(--c);
      color: #ffffff;
      font-family: var(--f-body);
      font-weight: 700;
      padding: 8px 24px;
      border-radius: 999px;
      border: 3px solid var(--accent);
      transition: transform 0.2s;
    }

    summary::-webkit-details-marker { display: none; }
    summary:hover { transform: scale(1.07); }
    details[open] summary { margin-bottom: 12px; }
    details { text-align: left; }

    h3 {
      font-family: var(--f-script);
      font-weight: 400;
      font-size: var(--h3-size);
      color: var(--c);
      margin-top: 12px;
      border-bottom: 2px dotted var(--accent);
    }

    ul, ol {
      margin: 8px 0 0 22px;
      font-size: 0.95rem;
    }

    li { margin-bottom: 4px; }
    li::marker { color: var(--c); font-weight: bold; }

    /* ---------- Photos et stickers (optionnels) ---------- */
    .recette img.photo {
      display: block;
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 14px;
      border: 3px solid var(--accent);
      margin-bottom: 14px;
    }

    .recette img.sticker {
      position: absolute;
      top: -22px;
      right: -22px;
      width: 95px;
      height: 95px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #ffffff;
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
      transform: rotate(12deg);
      z-index: 2;
      transition: transform 0.2s;
    }

    .recette img.sticker:hover { transform: rotate(0deg) scale(1.6); }

    /* ---------- Pied de page ---------- */
    footer {
      margin-top: 50px;
      padding: 30px 20px;
      text-align: center;
      background: var(--nav-bg);
      color: var(--nav-txt);
      border-top: 8px double var(--tab-on-bg);
      font-family: var(--f-script);
      font-size: var(--pied-size);
    }

    /* ============================================================
       3. DÉCOR PROPRE À CHAQUE SAISON
       ============================================================ */

    /* Badge numéro (printemps, automne, hiver) */
    body[data-saison="printemps"] .recette::before,
    body[data-saison="automne"] .recette::before,
    body[data-saison="hiver"] .recette::before {
      position: absolute;
      top: -17px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--c);
      color: #ffffff;
      font-family: var(--f-script);
      font-size: var(--badge-size);
      padding: 1px 18px;
      border-radius: 999px;
      border: 3px solid var(--accent);
      white-space: nowrap;
    }

    /* ----- 🌸 PRINTEMPS ----- */
    body[data-saison="printemps"] header::after {
      content: "";
      height: 28px;
      margin: 36px -20px -46px;
      background:
        radial-gradient(circle at 20px 28px, var(--nav-bg) 0 21px, transparent 22px) 0 0 / 80px 28px repeat-x,
        radial-gradient(circle at 60px 28px, var(--nav-bg) 0 16px, transparent 17px) 0 0 / 80px 28px repeat-x;
    }

    body[data-saison="printemps"] .recette {
      padding: 44px 22px 30px;
      border: 3px solid var(--c);
      border-radius: 34px 34px 34px 10px;
      background: #ffffff;
      background: linear-gradient(180deg, color-mix(in srgb, var(--c) 12%, #ffffff) 0, #ffffff 110px);
      box-shadow: 0 12px 26px rgba(120, 70, 100, 0.15);
    }

    body[data-saison="printemps"] .recette::before { content: "n° " counter(recette); }

    body[data-saison="printemps"] .recette::after {
      content: "🌼";
      position: absolute;
      right: 12px;
      bottom: -14px;
      font-size: 1.7rem;
      transform: rotate(14deg);
    }

    /* ----- ☀️ ÉTÉ ----- */
    body[data-saison="ete"] header::before {
      content: "";
      height: 44px;
      margin: -46px -20px 24px;
      background:
        linear-gradient(90deg, #e63946 50%, #fff8e0 50%) 0 0 / 80px 24px repeat-x,
        radial-gradient(circle at 20px 0, #e63946 0 20px, transparent 21px) 0 24px / 80px 20px repeat-x,
        radial-gradient(circle at 60px 0, #fff8e0 0 20px, transparent 21px) 0 24px / 80px 20px repeat-x;
    }

    body[data-saison="ete"] header::after {
      content: "";
      height: 20px;
      margin: 30px -20px -46px;
      background: radial-gradient(circle at 20px 20px, var(--nav-bg) 0 20px, transparent 21px) 0 0 / 40px 20px repeat-x;
    }

    body[data-saison="ete"] .recette {
      padding: 62px 22px 28px;
      border: 4px solid var(--c);
      border-radius: 24px;
      box-shadow: 6px 6px 0 var(--c);
      overflow: hidden;
    }

    /* Auvent rayé sur chaque carte */
    body[data-saison="ete"] .recette::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      background:
        linear-gradient(90deg, var(--c) 50%, #ffefb8 50%) 0 0 / 60px 24px repeat-x,
        radial-gradient(circle at 15px 0, var(--c) 0 15px, transparent 16px) 0 24px / 60px 15px repeat-x,
        radial-gradient(circle at 45px 0, #ffefb8 0 15px, transparent 16px) 0 24px / 60px 15px repeat-x;
    }

    body[data-saison="ete"] .recette:nth-child(odd)  { transform: rotate(-1deg); }
    body[data-saison="ete"] .recette:nth-child(even) { transform: rotate(1deg); }
    body[data-saison="ete"] .recette:hover { transform: rotate(0deg) translateY(-6px); }

    body[data-saison="ete"] .recette img.sticker { top: 50px; right: 10px; width: 80px; height: 80px; }

    /* ----- 🍂 AUTOMNE ----- */
    body[data-saison="automne"] header::after {
      content: "";
      height: 14px;
      margin: 38px -20px -46px;
      background: conic-gradient(from 135deg at 50% 0, var(--nav-bg) 0 90deg, transparent 90deg) 0 0 / 28px 14px repeat-x;
    }

    body[data-saison="automne"] .recette {
      padding: 38px 22px 26px;
      border: 2px solid #4a3123;
      border-radius: 18px;
      box-shadow: 6px 6px 0 var(--c);
      outline: 2px dashed var(--accent);
      outline-offset: -10px;
    }

    body[data-saison="automne"] .recette::before { content: "n° " counter(recette); }

    /* ----- ❄️ HIVER ----- */
    body[data-saison="hiver"] header::before {
      content: "";
      height: 34px;
      margin: -46px -20px 22px;
      border-top: 3px solid #222222;
      background-image:
        radial-gradient(circle at 15px 17px, #ffd23f 0 7px, transparent 8px),
        radial-gradient(circle at 45px 17px, #3ddc97 0 7px, transparent 8px),
        radial-gradient(circle at 75px 17px, #4cc9f0 0 7px, transparent 8px),
        radial-gradient(circle at 105px 17px, #ff8fab 0 7px, transparent 8px);
      background-size: 120px 34px;
      background-repeat: repeat-x;
    }

    body[data-saison="hiver"] header::after {
      content: "";
      height: 20px;
      margin: 34px -20px -46px;
      background: repeating-linear-gradient(45deg, #fffdf6 0 14px, #0b6e4f 14px 28px);
    }

    body[data-saison="hiver"] .recette {
      padding: 40px 22px 26px;
      border: 4px solid var(--c);
      border-radius: 20px;
      box-shadow: 7px 7px 0 var(--c);
      outline: 2px dashed var(--accent);
      outline-offset: -11px;
    }

    body[data-saison="hiver"] .recette::before { content: "Recette n° " counter(recette); }

    body[data-saison="hiver"] .recette:hover { transform: translateY(-6px) rotate(-1deg); }

    /* ============================================================
       4. ANIMATIONS : apparition des cartes + particules de saison
       ============================================================ */
    @keyframes apparition {
      from { opacity: 0; transform: translateY(26px); }
    }

    #particules {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 40;
    }

    #particules span {
      position: absolute;
      top: 0;
      opacity: 0.85;
      will-change: transform;
      animation-iteration-count: infinite;
      animation-timing-function: linear;
    }

    #particules.tombe span { animation-name: tomber; }
    #particules.monte span { animation-name: monter; }

    @keyframes tomber {
      from { transform: translate(0, -8vh) rotate(0deg); }
      50%  { transform: translate(40px, 50vh) rotate(180deg); }
      to   { transform: translate(-30px, 108vh) rotate(360deg); }
    }

    @keyframes monter {
      from { transform: translate(0, 108vh) scale(0.6); }
      50%  { transform: translate(30px, 50vh) scale(1); }
      to   { transform: translate(-20px, -8vh) scale(1.1); }
    }

    @media (prefers-reduced-motion: reduce) {
      #particules { display: none; }
      .recette { animation: none; }
      html { scroll-behavior: auto; }
    }

    /* ============================================================
       5. ADAPTATION TABLETTE ET TÉLÉPHONE
       ============================================================ */
    @media (max-width: 900px) {
      .recettes { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      .recettes { grid-template-columns: 1fr; }
      .onglet { padding: 6px 14px; }
      .deco { letter-spacing: 8px; }
    }
  </style>
</head>

<body data-saison="automne">

  <div id="particules" aria-hidden="true"></div>

  <header>
    <p class="deco" id="deco"></p>
    <h1 id="titre"></h1>
    <p class="sous-titre" id="sous-titre"></p>
  </header>

  <nav class="onglets" role="tablist" aria-label="Choisir une saison">
    <button class="onglet" role="tab" data-saison="printemps">🌸 Printemps</button>
    <button class="onglet" role="tab" data-saison="ete">☀️ Été</button>
    <button class="onglet" role="tab" data-saison="automne">🍂 Automne</button>
    <button class="onglet" role="tab" data-saison="hiver">❄️ Hiver</button>
  </nav>

  <main>
    <div class="recettes" id="recettes"></div>
    <noscript><p>Activez JavaScript pour afficher les recettes.</p></noscript>
  </main>

  <footer>
    <p id="pied"></p>
  </footer>

  <script>
    /* ============================================================
       MES RECETTES
       Pour ajouter une recette : copiez un bloc { ... } complet
       (virgule comprise) dans la bonne saison et changez les textes.
       Pour mettre une photo : ajoutez   photo: "images/ma-photo.jpg",
       Pour un sticker dans le coin :    sticker: "images/mon-image.jpg",
       ============================================================ */
    const SAISONS = {

      printemps: {
        titre: "Bonjour printemps !",
        sous: "Neuf recettes fraîches et fleuries",
        deco: "🌷 🌸 🌿",
        pied: "🌷 Bon appétit et joli printemps 🌷",
        particules: ["🌸", "🌼", "🌸", "🌷"],
        sens: "tombe",
        recettes: [
          { emoji: "🌱", titre: "Velouté petits pois-menthe", temps: "25 min", pers: "4 personnes",
            ingredients: ["500 g de petits pois (frais ou surgelés)", "1 oignon", "75 cl de bouillon de légumes", "10 feuilles de menthe", "10 cl de crème"],
            etapes: ["Faire revenir l'oignon émincé dans une casserole.", "Ajouter les petits pois et le bouillon, cuire 15 minutes.", "Ajouter la menthe, puis mixer finement.", "Terminer avec la crème et servir tiède ou froid."] },

    // Construit le code HTML d'une carte de recette
    function carte(r, i) {
      const visuel = r.photo
        ? `<img class="photo" src="${r.photo}" alt="${r.titre}">`
        : `<p class="emoji">${r.emoji}</p>`;
      const sticker = r.sticker
        ? `<img class="sticker" src="${r.sticker}" alt="Sticker">`
        : "";
      const liste = (tableau) => tableau.map((x) => `<li>${x}</li>`).join("");

      return `
        <article class="recette" style="--i:${i}">
          ${sticker}
          ${visuel}
          <h2>${r.titre}</h2>
          <p class="infos">⏱ ${r.temps} · 👥 ${r.pers}</p>
          <details>
            <summary>Voir la recette</summary>
            <h3>Ingrédients</h3>
            <ul>${liste(r.ingredients)}</ul>
            <h3>Préparation</h3>
            <ol>${liste(r.etapes)}</ol>
          </details>
        </article>`;
    }

    // Lance les flocons, pétales, feuilles ou bulles de la saison
    function lancerParticules(s) {
      const zone = document.getElementById("particules");
      zone.innerHTML = "";
      zone.className = s.sens;
      for (let i = 0; i < 18; i++) {
        const p = document.createElement("span");
        p.textContent = s.particules[i % s.particules.length];
        p.style.left = Math.random() * 100 + "%";
        p.style.fontSize = 14 + Math.random() * 18 + "px";
        p.style.animationDuration = 9 + Math.random() * 10 + "s";
        p.style.animationDelay = -Math.random() * 18 + "s";
        zone.appendChild(p);
      }
    }

    // Affiche une saison : change le thème, les textes, les recettes
    function afficher(cle, remonter) {
      const s = SAISONS[cle];
      document.body.dataset.saison = cle;
      document.getElementById("deco").textContent = s.deco;
      document.getElementById("titre").textContent = s.titre;
      document.getElementById("sous-titre").textContent = s.sous;
      document.getElementById("pied").textContent = s.pied;
      document.getElementById("recettes").innerHTML = s.recettes.map(carte).join("");

      document.querySelectorAll(".onglet").forEach((bouton) => {
        const actif = bouton.dataset.saison === cle;
        bouton.classList.toggle("actif", actif);
        bouton.setAttribute("aria-selected", actif ? "true" : "false");
      });

      lancerParticules(s);
      if (remonter) window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // La saison affichée au départ dépend du mois en cours
    function saisonActuelle() {
      const mois = new Date().getMonth() + 1;
      if (mois >= 3 && mois <= 5) return "printemps";
      if (mois >= 6 && mois <= 8) return "ete";
      if (mois >= 9 && mois <= 11) return "automne";
      return "hiver";
    }

    document.querySelectorAll(".onglet").forEach((bouton) => {
      bouton.addEventListener("click", () => afficher(bouton.dataset.saison, true));
    });

    afficher(saisonActuelle(), false);
  </script>
